<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Run of Show, on the day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F2; color: #171E19; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; font-size: 17px; line-height: 1.3; display: flex; flex-direction: column; overflow: hidden;">

  <nav style="height: 52px; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
    <button style="display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; border: 0; background: none; color: #073E27; font-size: 17px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Upcoming
    </button>
    <div style="display: flex; gap: 8px;">
      <button style="min-height: 40px; padding: 0 16px; border-radius: 999px; border: 0.5px solid rgba(23,30,25,0.16); background: #FFFFFF; color: #073E27; font-size: 15px; font-weight: 600;">Edit</button>
      <button aria-label="More actions" style="width: 40px; height: 40px; border-radius: 999px; border: 0.5px solid rgba(23,30,25,0.16); background: #FFFFFF; color: #073E27; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>
  </nav>

  <header style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 4px;">
    <div style="font-size: 15px; color: #626860;">Day 2 of 3 · Sat 17 Oct</div>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em;">Silverstone weekend</h1>
  </header>

  <section aria-label="Next call" style="margin: 18px 16px 0; padding: 18px; border-radius: 12px; background: #073E27; color: #FAF8F2; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 15px;">
      <span style="color: #A7DCB4; font-weight: 600;">Qualifying · National League</span>
      <span style="color: #DCE9DF;">12° cloudy</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 44px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums;">Call in 19 min</span>
      <span style="font-size: 15px; color: #DCE9DF;">Call 8:00 AM · on air 9:00 – 10:00 AM</span>
    </div>
    <div role="img" aria-label="Timeline: now 7:41, call at 8:00, on air 9:00 to 10:00" style="display: flex; flex-direction: column; gap: 6px;">
      <div style="position: relative; height: 8px; border-radius: 999px; background: rgba(250,248,242,0.16);">
        <div style="position: absolute; left: 60%; right: 0; top: 0; bottom: 0; border-radius: 999px; background: #A7DCB4;"></div>
        <div style="position: absolute; left: 20%; top: -4px; width: 2px; height: 16px; border-radius: 1px; background: #FAF8F2;"></div>
        <div style="position: absolute; left: calc(7% - 7px); top: -3px; width: 14px; height: 14px; border-radius: 999px; background: #FAF8F2; border: 3px solid #073E27; box-sizing: border-box;"></div>
      </div>
      <div style="position: relative; height: 16px; font-size: 12px; color: #DCE9DF; font-variant-numeric: tabular-nums;">
        <span style="position: absolute; left: 0;">Now</span><span style="position: absolute; left: 20%; transform: translateX(-50%);">Call 8:00</span><span style="position: absolute; left: 60%;">On air 9:00</span><span style="position: absolute; right: 0;">10:00</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px;">
      <button style="flex: 1; min-height: 50px; border: 0; border-radius: 999px; background: #A7DCB4; color: #073E27; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">Session details</button>
      <button style="min-height: 50px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(250,248,242,0.4); background: transparent; color: #FAF8F2; font-size: 16px; font-weight: 600;">Notes</button>
    </div>
  </section>

  <section aria-label="Today" style="margin-top: 26px; padding: 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <h2 style="margin: 0 4px; font-size: 20px; font-weight: 700;">Today</h2>
    <div style="background: #FFFFFF; border: 0.5px solid rgba(23,30,25,0.16); border-radius: 12px;">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(7,62,39,0.05); border-radius: 12px 12px 0 0;">
        <div style="width: 58px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums;">
          <span style="font-size: 17px; font-weight: 600;">9:00</span><span style="font-size: 12px; color: #626860;">AM</span>
        </div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 600;">Qualifying</span>
          <span style="font-size: 14px; color: #073E27; font-weight: 600;">Up next · call 8:00</span>
        </div>
      </div>
      <div style="height: 0.5px; background: rgba(23,30,25,0.16); margin-left: 84px;"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 14px;">
        <div style="width: 58px; height: 40px; border-radius: 8px; border: 1.5px dashed rgba(136,87,12,0.55); display: flex; align-items: center; justify-content: center; color: #88570C; font-size: 13px; font-weight: 600;">TBC</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-weight: 600;">Sprint</span>
          <span style="font-size: 14px; color: #88570C;">Tentative · coverage undecided</span>
        </div>
        <button style="min-height: 44px; padding: 0 10px; border: 0; background: none; color: #073E27; font-size: 15px; font-weight: 600;">Add time</button>
      </div>
    </div>
  </section>

  <section aria-label="Rest of the weekend" style="margin-top: 22px; padding: 0 16px; display: flex; flex-direction: column; gap: 8px;">
    <div style="background: #FFFFFF; border: 0.5px solid rgba(23,30,25,0.16); border-radius: 12px; font-size: 15px;">
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 0; background: none; color: #171E19; text-align: left;">
        <span style="width: 58px; color: #073E27; font-weight: 600;">Sun 18</span>
        <span style="flex: 1;">Race · 9:00 AM</span>
        <span style="color: #626860;">Call 7:30</span>
      </button>
      <div style="height: 0.5px; background: rgba(23,30,25,0.16); margin-left: 84px;"></div>
      <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 14px; border: 0; background: none; color: #626860; text-align: left;">
        <span style="width: 58px; font-weight: 600;">Fri 16</span>
        <span style="flex: 1;">Practice 1 covered</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
  </section>

  <div style="margin: 26px 20px 0; display: flex; justify-content: space-between; align-items: baseline;">
    <h2 style="margin: 0; font-size: 20px; font-weight: 700;">After the weekend</h2>
    <span style="font-size: 15px; color: #626860; font-variant-numeric: tabular-nums;">€1,800 agreed</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
