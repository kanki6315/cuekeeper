name: Cuekeeper
configs:
  Debug: debug
  CloudKitSetup: debug
  Release: release
options:
  bundleIdPrefix: com.arjunakankipati.cuekeeper
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TDBAHN96B3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.7
    CURRENT_PROJECT_VERSION: 1
    CLOUDKIT_ENVIRONMENT: Development
  configs:
    CloudKitSetup:
      CLOUDKIT_ENVIRONMENT: Development
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG CLOUDKIT_SCHEMA_SETUP"
    Release:
      CLOUDKIT_ENVIRONMENT: Production
targets:
  Cuekeeper:
    type: application
    platform: iOS
    sources:
      - path: Cuekeeper
      - path: design/brand/Cuekeeper.icon
    entitlements:
      path: Cuekeeper/Cuekeeper.entitlements
      properties:
        aps-environment: development
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.arjunakankipati.cuekeeper
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT)
    info:
      path: Cuekeeper/Info.plist
      properties:
        CuekeeperCloudKitEnvironment: $(CLOUDKIT_ENVIRONMENT)
        CFBundleDisplayName: Cuekeeper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Cuekeeper reads and updates its own job placeholders and confirmed sessions in your selected calendar.
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.cuekeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: Cuekeeper
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  CuekeeperSchemaHelper:
    type: application
    platform: macOS
    deploymentTarget: '15.0'
    sources:
      - path: CloudKitSetupMac
      - path: Cuekeeper/Storage/Cuekeeper.xcdatamodeld
      - path: Cuekeeper/Storage/Job.swift
      - path: Cuekeeper/Storage/WorkEvent.swift
      - path: Cuekeeper/Storage/WorkSession.swift
      - path: Cuekeeper/Storage/Fees.swift
      - path: Cuekeeper/Storage/Billing.swift
      - path: Cuekeeper/CalendarPublisher.swift
    entitlements:
      path: CloudKitSetupMac/SchemaHelper.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.arjunakankipati.cuekeeper
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-environment: Development
    info:
      path: CloudKitSetupMac/Info.plist
      properties:
        LSUIElement: true
        CuekeeperCloudKitEnvironment: Development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.cuekeeper
        PRODUCT_NAME: CuekeeperSchemaHelper
        TARGETED_DEVICE_FAMILY: ''
        CLOUDKIT_ENVIRONMENT: Development
        ENABLE_HARDENED_RUNTIME: YES
  CuekeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CuekeeperTests]
    dependencies:
      - target: Cuekeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CuekeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CuekeeperUITests]
    dependencies:
      - target: Cuekeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cuekeeper:
    build:
      targets:
        Cuekeeper: all
    test:
      targets: [CuekeeperTests, CuekeeperUITests]
      gatherCoverageData: true
  Cuekeeper - Initialize CloudKit:
    build:
      targets:
        Cuekeeper: [run]
    run:
      config: CloudKitSetup
    archive:
      config: Release
  Cuekeeper - Mac CloudKit Setup:
    build:
      targets:
        CuekeeperSchemaHelper: [run]
    run:
      config: CloudKitSetup
