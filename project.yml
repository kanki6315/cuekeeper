name: Cuekeeper
options:
  bundleIdPrefix: com.arjunakankipati.cuekeeper
  deploymentTarget:
    iOS: '27.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: TDBAHN96B3
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    CLOUDKIT_ENVIRONMENT: Development
  configs:
    Release:
      CLOUDKIT_ENVIRONMENT: Production
targets:
  Cuekeeper:
    type: application
    platform: iOS
    sources:
      - path: Cuekeeper
      - path: design/brand/Cuekeeper.icon
    entitlements:
      path: Cuekeeper/Cuekeeper.entitlements
      properties:
        aps-environment: development
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.arjunakankipati.cuekeeper
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-environment: $(CLOUDKIT_ENVIRONMENT)
    info:
      path: Cuekeeper/Info.plist
      properties:
        CFBundleDisplayName: Cuekeeper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [remote-notification]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arjunakankipati.cuekeeper
        ASSETCATALOG_COMPILER_APPICON_NAME: Cuekeeper
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  CuekeeperTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CuekeeperTests]
    dependencies:
      - target: Cuekeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  CuekeeperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CuekeeperUITests]
    dependencies:
      - target: Cuekeeper
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Cuekeeper:
    build:
      targets:
        Cuekeeper: all
    test:
      targets: [CuekeeperTests, CuekeeperUITests]
      gatherCoverageData: true
